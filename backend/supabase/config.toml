# Local Supabase settings. Anything not listed uses the CLI default.
project_id = "blink"

[db]
major_version = 17

[auth]
# One owner per server: nobody can sign up. Create your user in the dashboard (Authentication › Users › Add user).
enable_signup = false

[auth.email]
enable_signup = false

# These check the caller themselves: the mail schedule (cron secret) and the sign-in helper (a browser, before any login).
[functions.capture]
verify_jwt = false

[functions.mail]
verify_jwt = false

[functions.signin]
verify_jwt = false
