name: CI
on:
  push:
  pull_request:

jobs:
  database:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_PASSWORD: test
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 2s --health-retries 30
    steps:
      - uses: actions/checkout@v4
      - name: Migrations and RLS checks
        env:
          DATABASE_URL: postgresql://postgres:test@localhost:5432/postgres
        run: backend/supabase/tests/run.sh

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  swift:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: BlinkKit tests
        working-directory: apps/Blink/BlinkKit
        run: swift test

  functions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.1.4
      - name: Type-check Edge Functions
        run: deno check backend/supabase/functions/*/index.ts
      - name: Edge Function tests
        run: deno test backend/supabase/functions/
